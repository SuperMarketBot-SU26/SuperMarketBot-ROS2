# nav2_params_robot.yaml — Nav2 params for SuperMarketBot REAL ROBOT mode.
#
# Used by smb_robot.launch.py when `use_nav2:=true`.
#
# Differences from nav2_params.yaml (sim mode):
#   - use_sim_time: False on ALL nodes (wall-clock, not /clock from Gazebo)
#   - All other parameters identical; tune controller frequency, tolerances,
#     and costmap ranges during real-robot bringup.
#
# NOTE: odom_topic is /odom directly (ESP32 PWM odometry).
#       Phase 2 (robot_localization EKF) will produce /odometry/filtered
#       as the fused output. Switch odom_topic to /odometry/filtered then.
#
# Frame conventions (matches docs/TOPIC_CONTRACT.md):
#   robot_base_frame  = base_link
#   global_frame      = map      (slam_toolbox publishes /map)
#   odom_frame        = odom     (ESP32 publishes /odom via micro-ROS)

bt_navigator:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    transform_tolerance: 1.5
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_relay
    bt_loop_duration: 10
    default_server_timeout: 20
    default_cancel_timeout: 50
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    bt_search_directories:
      - $(find-pkg-share nav2_bt_navigator)/behavior_trees

controller_server:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    # High-speed 20 Hz control loop utilizes available CPU capacity for precise tracking
    controller_frequency: 20.0
    odom_topic: /odom_relay
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 10.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    current_progress_checker: progress_checker
    current_goal_checker: general_goal_checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 45.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      debug_trajectory_details: True
      min_vel_x: 0.008     # Adjusted to 0.008 m/s (0.8 cm/s) to support slow-speed maneuvers
      min_vel_y: 0.0
      max_vel_x: 0.012     # Adjusted from 0.015 to 0.012 m/s (1.2 cm/s) to minimize tire slippage and increase LiDAR scan sampling density per meter traveled
      min_vel_theta: 0.30
      max_vel_theta: 0.95  # Elevated from 0.85 to 0.95 rad/s (~54 deg/s) for crisp turning maneuvers
      acc_lim_x: 0.05
      acc_lim_theta: 0.35  # Elevated from 0.05 to 0.35 rad/s² to reach turning velocity smoothly without prolonged acceleration delays
      desired_linear_vel: 0.012  # Synchronized with max_vel_x at 0.012 m/s
      lookahead_dist: 0.65  # Increased from 0.35m to 0.65m: extends forward collision detection carrot half a meter ahead to prevent ramming into dynamic obstructions
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.010  # Reduced to 0.010 m/s (1.0 cm/s) for controlled deceleration around turning radii
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.75  # Elevated from 0.65 to 0.75 rad/s (~43 deg/s) for immediate orientation pivots before linear travel
      transform_tolerance: 1.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 20.0 # 30cm braking distance at 1.5cm/s: halt motor outputs before physical contact occurs
      use_cost_regulated_linear_velocity_scaling: true # Automatically decelerate when traversing near obstacle proximity borders
      cost_scaling_dist: 0.3                           # Begin decelerating when within 30cm of obstacles
      cost_scaling_gain: 1.0                           # Proportional damping coefficient near hazards

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      tf_buffer_duration: 30.0
      update_frequency: 20.0
      publish_frequency: 15.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.5
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.20  # Expanded to 0.20m (40cm protective diameter) to ensure attenuated reflections from human fabric trigger immediate braking halts before physical contact occurs
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_relay
          sensor_frame: laser_frame
          data_type: "LaserScan"
          raytrace_range: 3.0
          obstacle_range: 2.5
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.50  # Expanded to 0.50m to project a prominent half-meter safety buffer around individual obstacle points
        cost_scaling_factor: 1.0 # Relaxed drop-off coefficient enforces early obstacle deceleration

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      tf_buffer_duration: 30.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.5
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.20  # Synchronized with local costmap radius (0.20m) to ensure consistent routing clearances around obstacles
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_relay
          sensor_frame: laser_frame
          data_type: "LaserScan"
          raytrace_range: 6.0
          obstacle_range: 5.0
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.50  # Synchronized half-meter safety inflation across global trajectory plans
        cost_scaling_factor: 1.0

planner_server:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    transform_tolerance: 1.5
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    transform_tolerance: 1.5
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 500

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      max_rotational_vel: 0.60
      min_rotational_vel: 0.30
      rotational_acc_lim: 0.05
    backup:
      plugin: "nav2_behaviors::BackUp"
      max_linear_vel: 0.02
      min_linear_vel: 0.01
      linear_acc_lim: 0.10
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
