# nav2_params_robot.yaml — Nav2 params for SuperMarketBot REAL ROBOT mode.
#
# Used by smb_robot.launch.py when `use_nav2:=true`.
#
# Differences from nav2_params.yaml (sim mode):
#   - use_sim_time: False on ALL nodes (wall-clock, not /clock from Gazebo)
#   - All other parameters identical; tune controller frequency, tolerances,
#     and costmap ranges during real-robot bringup.
#
# NOTE: odom_topic is /odom directly (ESP32 PWM odometry).
#       Phase 2 (robot_localization EKF) will produce /odometry/filtered
#       as the fused output. Switch odom_topic to /odometry/filtered then.
#
# Frame conventions (matches docs/TOPIC_CONTRACT.md):
#   robot_base_frame  = base_link
#   global_frame      = map      (slam_toolbox publishes /map)
#   odom_frame        = odom     (ESP32 publishes /odom via micro-ROS)

bt_navigator:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    transform_tolerance: 1.0
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_cancel_timeout: 50
    wait_for_service_timeout: 10000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    bt_search_directories:
      - $(find-pkg-share nav2_bt_navigator)/behavior_trees

controller_server:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    controller_frequency: 30.0
    odom_topic: /odom
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.80 # Pumped up further to ensure no weak rotational commands are sent
    failure_tolerance: 10.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    current_progress_checker: progress_checker
    current_goal_checker: general_goal_checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 45.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15  # Reduced to 0.15m (Note: lower values might cause oscillations)
      yaw_goal_tolerance: 3.14 # Temporarily disabled (180 degrees) so it ignores final heading entirely
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      debug_trajectory_details: False  # Disabled to eliminate terminal console spam and preserve CPU cycles for SLAM optimization
      min_vel_x: 0.01      # Adjusted for new max velocity
      min_vel_y: 0.0
      max_vel_x: 0.03      # Set to 0.03 m/s as requested
      min_vel_theta: 0.10  # Reduced to allow graceful deceleration
      max_vel_theta: 0.30  # Lowered
      acc_lim_x: 0.1       # Much smoother acceleration
      acc_lim_theta: 0.25   # Reduced from 0.5 to 0.25 to avoid wheel slip when starting/stopping rotation
      desired_linear_vel: 0.03 # Set to 0.03 m/s as requested
      use_velocity_scaled_lookahead_dist: true # Look further ahead when moving fast!
      min_lookahead_dist: 1.5  # Increased from 1.0m to 1.5m to further smooth out SLAM corrections
      max_lookahead_dist: 2.0
      lookahead_time: 3.0 # Increased from 2.5 to look further ahead
      lookahead_dist: 1.50 # Fallback
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0 # Slow down earlier on wider turns to prevent drifting
      regulated_linear_scaling_min_speed: 0.01   # Synchronized with min_vel_x at 0.01 m/s
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.70 # Increased to 0.7 to completely eliminate in-place swerving/oscillation
      rotate_to_heading_angular_vel: 0.30 # Reduced from 0.69 to 0.30 to prevent wheel slip during in-place rotation
      transform_tolerance: 1.0 # Restored transform tolerance to 1.0s
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 10.0 # 15cm braking window at 1.5cm/s: halt motor output right before physical obstruction without blocking maneuvering detours
      use_cost_regulated_linear_velocity_scaling: false # Automatically decelerate when traversing near obstacle proximity borders
      cost_scaling_dist: 0.3                           # Begin decelerating when within 30cm of obstacles
      cost_scaling_gain: 1.0                           # Proportional damping coefficient near hazards

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      tf_buffer_duration: 30.0
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.20  # Expanded to 0.20m (40cm protective diameter) to ensure attenuated reflections from human fabric trigger immediate braking halts before physical contact occurs
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_frame
          data_type: "LaserScan"
          raytrace_range: 3.0
          obstacle_range: 2.5
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45   # Increased to 0.45m to be more sensitive to obstacles
        cost_scaling_factor: 2.0 # Lowered to 2.0 for a more gradual cost gradient to keep robot further away

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      tf_buffer_duration: 30.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.0
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.20  # Synchronized with local costmap radius (0.20m) to ensure consistent routing clearances around obstacles
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_frame
          data_type: "LaserScan"
          raytrace_range: 6.0
          obstacle_range: 5.0
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45   # Synchronized with local costmap
        cost_scaling_factor: 2.0 # Synchronized with local costmap

planner_server:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    transform_tolerance: 1.0
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    transform_tolerance: 1.0 # Restored transform tolerance to 1.0s
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 500

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      max_rotational_vel: 2.50
      min_rotational_vel: 0.80
      rotational_acc_lim: 5.0
    backup:
      plugin: "nav2_behaviors::BackUp"
      max_linear_vel: 0.25
      min_linear_vel: 0.05
      linear_acc_lim: 1.0
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
