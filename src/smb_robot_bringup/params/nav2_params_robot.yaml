# nav2_params_robot.yaml — Nav2 params for SuperMarketBot REAL ROBOT mode.
#
# Used by smb_robot.launch.py when `use_nav2:=true`.
#
# Differences from nav2_params.yaml (sim mode):
#   - use_sim_time: False on ALL nodes (wall-clock, not /clock from Gazebo)
#   - All other parameters identical; tune controller frequency, tolerances,
#     and costmap ranges during real-robot bringup.
#
# Nav2 consumes wheel odometry directly (/odom).
#
# Frame conventions (matches docs/TOPIC_CONTRACT.md):
#   robot_base_frame  = base_link
#   global_frame      = map      (slam_toolbox publishes /map)
#   odom_frame        = odom     (ESP32 publishes /odom via micro-ROS)

bt_navigator:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    transform_tolerance: 1.0
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_cancel_timeout: 50
    wait_for_service_timeout: 10000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    bt_search_directories:
      - $(find-pkg-share nav2_bt_navigator)/behavior_trees

controller_server:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    controller_frequency: 10.0 # Reduced from 30.0 to 10.0 to prevent Pi 5 CPU overload & loop misses
    odom_topic: /odom
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.005
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.01 # Lowered from 0.80 so rotation commands are not dropped
    failure_tolerance: 10.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    current_progress_checker: progress_checker
    current_goal_checker: general_goal_checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 10.0 # Increased to 10s to give 4WD chassis sufficient time to rotate and overcome static friction
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.08 # Lowered to 8cm (0.08m) for precise arrival at target goal
      yaw_goal_tolerance: 0.25 # Require target heading at goal (~14.3 deg tolerance)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      debug_trajectory_details: False
      min_vel_x: 0.06      # Sufficient minimum forward speed to overcome 4WD static tire friction
      min_vel_y: 0.0
      max_vel_x: 0.10      # Maintained at 0.10 m/s (linear speed is stable)
      min_vel_theta: 0.80  # Boosted to 0.80 rad/s to guarantee sufficient torque against 4WD wheel friction
      max_vel_theta: 2.00  # Boosted to 2.00 rad/s (100% full power matching firmware ROS2_ANG_MAX_FWD)
      acc_lim_x: 0.6       # Responsive linear acceleration
      acc_lim_theta: 3.5   # Strong angular acceleration (3.5 rad/s^2) for immediate rotational torque
      desired_linear_vel: 0.10 # Maintained cruise speed matching max_vel_x
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.35 # Ensures carrot point stays well ahead of the robot
      max_lookahead_dist: 0.70
      lookahead_time: 1.0
      lookahead_dist: 0.40
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.80
      regulated_linear_scaling_min_speed: 0.06   # Keep motor torque alive on curves
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.50 # Rotate in place until heading error < 28 deg (~0.50 rad) before moving forward
      rotate_to_heading_angular_vel: 2.00 # Full 100% power in-place rotation (2.00 rad/s -> PWM_MAX 1023)
      transform_tolerance: 1.0
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 5.0
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.50
      cost_scaling_gain: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      tf_buffer_duration: 30.0
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.20  # Expanded to 0.20m (40cm protective diameter) to ensure attenuated reflections from human fabric trigger immediate braking halts before physical contact occurs
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_frame
          data_type: "LaserScan"
          raytrace_range: 3.0
          obstacle_range: 2.5
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.80   # Increased to 0.80m to push the global path much further away from obstacles
        cost_scaling_factor: 1.5 # Lowered to 1.5 for a wider, more gradual cost gradient

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      tf_buffer_duration: 30.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.0
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.20  # Synchronized with local costmap radius (0.20m) to ensure consistent routing clearances around obstacles
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_frame
          data_type: "LaserScan"
          raytrace_range: 6.0
          obstacle_range: 5.0
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.80   # Synchronized with local costmap
        cost_scaling_factor: 1.5 # Synchronized with local costmap

planner_server:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    transform_tolerance: 1.0
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    tf_buffer_duration: 30.0
    transform_tolerance: 1.0 # Restored transform tolerance to 1.0s
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 500

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      max_rotational_vel: 2.00
      min_rotational_vel: 0.80
      rotational_acc_lim: 3.5
    backup:
      plugin: "nav2_behaviors::BackUp"
      max_linear_vel: 0.25
      min_linear_vel: 0.05
      linear_acc_lim: 1.0
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.35  # Rotational noise from rotation (increased for 4WD skid-steer tire scrub)
    alpha2: 0.25  # Rotational noise from translation
    alpha3: 0.20  # Translational noise from translation
    alpha4: 0.35  # Translational noise from rotation (wheel slip during turns)
    alpha5: 0.20
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    max_beams: 180       # Increased from 60 to 180 for dense scan matching
    max_particles: 3000   # Increased from 2000 for wider pose hypothesis space
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.10   # Enabled Augmented MCL recovery (was 0.0)
    recovery_alpha_slow: 0.001  # Enabled Augmented MCL recovery (was 0.0)
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.35             # Widened from 0.20 to provide smooth attraction gradient
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 4.0  # Extends wall attraction basin to 4m
    tf_broadcast: True
    transform_tolerance: 1.0
    update_min_a: 0.08          # Updated threshold: ~4.6 deg (was 0.2 rad / 11.5 deg)
    update_min_d: 0.08          # Updated threshold: 8 cm (was 0.25 m)
    z_hit: 0.85
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.05
    do_beamskip: false          # CRITICAL: disabled beamskip so misaligned wall scans are not discarded
    scan_topic: scan
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    first_map_only: true

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

