behavior_server:
  ros__parameters:
    backup:
      linear_acc_lim: 1.0
      max_linear_vel: 0.25
      min_linear_vel: 0.05
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    spin:
      max_rotational_vel: 2.5
      min_rotational_vel: 0.8
      plugin: nav2_behaviors::Spin
      rotational_acc_lim: 5.0
    use_sim_time: false
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    bt_search_directories:
    - $(find-pkg-share nav2_bt_navigator)/behavior_trees
    default_cancel_timeout: 50
    default_server_timeout: 20
    global_frame: map
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: /odom
    robot_base_frame: base_link
    tf_buffer_duration: 30.0
    transform_tolerance: 1.0
    use_sim_time: false
    wait_for_service_timeout: 10000
controller_server:
  ros__parameters:
    FollowPath:
      acc_lim_theta: 3.2
      acc_lim_x: 1.5
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      debug_trajectory_details: false
      desired_linear_vel: 0.4
      lookahead_dist: 0.5
      max_allowed_time_to_collision_up_to_carrot: 10.0
      max_vel_theta: 1.6
      max_vel_x: 0.4
      min_vel_theta: 0.4
      min_vel_x: 0.05
      min_vel_y: 0.0
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.05
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785
      transform_tolerance: 1.0
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 0.3
    current_goal_checker: general_goal_checker
    current_progress_checker: progress_checker
    failure_tolerance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.8
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    odom_topic: /odom
    progress_checker:
      movement_time_allowance: 45.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.02
    progress_checker_plugins:
    - progress_checker
    tf_buffer_duration: 30.0
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        enabled: true
        inflation_radius: 0.25
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          obstacle_range: 5.0
          raytrace_range: 6.0
          sensor_frame: laser_frame
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_link
      robot_radius: 0.2
      static_layer:
        enabled: true
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
        subscribe_to_updates: true
      tf_buffer_duration: 30.0
      track_unknown_space: true
      transform_tolerance: 1.0
      update_frequency: 1.0
      use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      height: 3
      inflation_layer:
        cost_scaling_factor: 3.0
        enabled: true
        inflation_radius: 0.25
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          obstacle_range: 2.5
          raytrace_range: 3.0
          sensor_frame: laser_frame
          topic: /scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 10.0
      resolution: 0.05
      robot_base_frame: base_link
      robot_radius: 0.2
      rolling_window: true
      tf_buffer_duration: 30.0
      transform_tolerance: 1.0
      update_frequency: 20.0
      use_sim_time: false
      width: 3
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
    expected_planner_frequency: 10.0
    planner_plugins:
    - GridBased
    tf_buffer_duration: 30.0
    transform_tolerance: 1.0
    use_sim_time: false
waypoint_follower:
  ros__parameters:
    loop_rate: 10
    stop_on_failure: true
    tf_buffer_duration: 30.0
    transform_tolerance: 1.0
    use_sim_time: false
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 500
    waypoint_task_executor_plugin: wait_at_waypoint
