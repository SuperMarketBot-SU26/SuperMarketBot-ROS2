# nav2_params.yaml — Nav2 params for SuperMarketBot SIM mode.
#
# Used by smb_sim.launch.py when `use_nav2:=true` — which pulls in
# nav2_bringup's bringup_launch.py with slam:=False and
# use_localization:=False (we already run slam_toolbox separately, and
# slam_toolbox publishes /map directly so AMCL is not needed).
#
# Frame conventions (matches docs/TOPIC_CONTRACT.md):
#   robot_base_frame  = base_link
#   global_frame      = map      (slam_toolbox publishes /map)
#   odom_frame        = odom     (DiffDrive publishes /odom)
#
# The contract says navigation SHOULD use `/odometry/filtered` (EKF) for
# real-robot. For now this file uses `/odom` directly because Phase-1 sim
# doesn't run robot_localization (Phase 2 work). When that lands, change
# the odom_topic below to /odometry/filtered and the contract is honored.

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_cancel_timeout: 50
    wait_for_service_timeout: 1000
    # Navigator plugins — both action servers need to be registered.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    bt_search_directories:
      - $(find-pkg-share nav2_bt_navigator)/behavior_trees

controller_server:
  ros__parameters:
    use_sim_time: True
    # controller_frequency lowered from 20 to 5 Hz: the gz-sim-with-GUI
    # render thread competes with the controller for CPU on a developer
    # laptop, and DWB aborts with "Failed to make progress" if the actual
    # loop rate falls below ~75% of the configured rate (we were getting
    # 7 Hz vs target 20 Hz in windowed mode, 5 Hz in headless).
    # Tune back up once the sim's CPU budget is known for the target HW.
    controller_frequency: 5.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # failure_tolerance is the fraction of failed control cycles before
    # the controller aborts the goal. Default is 0.3 (i.e. abort if 30%
    # of cycles fail); we tolerate 1.0 (never abort on cycle misses alone)
    # because the controller IS reaching the robot, just below target rate.
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    # Nav2 (lyrical) requires an explicit "current_*" parameter naming which
    # plugin in the list is active. Without these, controller_server crashes
    # on the first goal with exit code -11 (SIGSEGV) — the warnings
    # "No goal checker was specified in parameter 'current_goal_checker'"
    # / "current_progress_checker" / "current_path_handler" appear once
    # then the container process dies. This pattern matches upstream Jazzy+
    # where the controller server validates these names.
    current_progress_checker: progress_checker
    current_goal_checker: general_goal_checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 3.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.14
    FollowPath:
      # Regulated Pure Pursuit — simpler than DWB, more stable for diff-drive.
      # Avoids the segment-traj critics that DWB depends on, which can segfault
      # controller_server in some lyrical builds when path samples are nearly
      # co-linear (the case for short in-place headings).
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      debug_trajectory_details: True
      use_collision_checking: True
      max_allowed_time_to_collision_up_to_carrot: 10.0
      min_vel_x: 0.015
      min_vel_y: 0.0
      max_vel_x: 0.15
      min_vel_theta: 0.025
      max_vel_theta: 0.5
      acc_lim_x: 0.25
      acc_lim_theta: 0.5
      # xy_goal_tolerance / yaw_goal_tolerance / stateful inherit from defaults.
      desired_linear_vel: 0.15
      lookahead_dist: 0.50
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.015
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.035
      # transform_tolerance: 300ms tolerance forces Nav2 to suspend motor commands
      # whenever map coordinate transforms lag behind real-time sensor updates.
      transform_tolerance: 0.3
      use_collision_detection: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.16
      plugins: ["obstacle_layer", "range_sensor_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_frame
          data_type: "LaserScan"
          raytrace_range: 3.0
          obstacle_range: 2.5
          marking: true
          clearing: true
      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/us_front_relay", "/us_rear_relay", "/us_left_relay", "/us_right_relay"]
        clear_on_max_reading: True
        phi: 0.26
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.16
      plugins: ["static_layer", "obstacle_layer", "range_sensor_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        # slam_toolbox publishes /map continuously; subscribe to updates
        # so the static layer reflects the live map (no save/load step).
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_frame
          data_type: "LaserScan"
          raytrace_range: 6.0
          obstacle_range: 5.0
          marking: true
          clearing: true
      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/us_front_relay", "/us_rear_relay", "/us_left_relay", "/us_right_relay"]
        clear_on_max_reading: True
        phi: 0.26
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 1.0

planner_server:
  ros__parameters:
    use_sim_time: True
    # Same throttle-down rationale as controller_frequency (see above).
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    # Same 5 Hz rationale: loop_rate controls how often waypoint_follower
    # ticks to check whether the current goal reached its tolerance.
    loop_rate: 5
    stop_on_failure: false
    # wait_at_waypoint plugin: pauses N ms at each waypoint, useful for
    # the user to observe robot pose before it advances.
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 2000

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      max_rotational_vel: 0.09
      min_rotational_vel: 0.05
      rotational_acc_lim: 0.12
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"