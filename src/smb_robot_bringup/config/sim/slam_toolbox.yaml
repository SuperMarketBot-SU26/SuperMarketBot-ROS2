# SLAM Toolbox config for SuperMarketBot SIM mode.
#
# Once Phase 2 lands, this will be replaced by the IOT-repo port at
# ros2_bridge/config/mapper_params_online_async.yaml — that one has been
# tuned on real hardware and is the canonical version.
#
# Until then, this file uses sane defaults aligned with the YDLIDAR X3
# spec and the contract in docs/TOPIC_CONTRACT.md.
#
# MIRROR: config/robot/slam_toolbox.yaml is the real-robot variant with
# loop closing re-enabled. Launch arg `slam_params_file` selects which
# one is used.

slam_toolbox:
  ros__parameters:
    # Frames (must match docs/TOPIC_CONTRACT.md)
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    # /scan messages arrive with header.frame_id = `laser_frame` because the
    # ros_gz_bridge config sets `frame_id: laser_frame` in the YAML. slam_toolbox
    # then looks up `laser_frame -> base_link`, which robot_state_publisher
    # already provides from the URDF.
    scan_topic: /scan

    # Map params
    mode: mapping          # online_async
    resolution: 0.05       # 5cm pixel, suitable for indoor supermarket
    map_start_x: 0.0
    map_start_y: 0.0
    map_start_yaw: 0.0

    # Match the YDLIDAR X3 spec + bridge-side filter range
    max_laser_range: 6.0
    min_laser_range: 0.15

    # Pose graph — keep nodes dense (low travel thresholds) so the loop-closure
    # search has plenty of candidates.
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    skip_odometry: false

    # Scan matching.
    #
    # WHY LOOP CLOSING IS DISABLED HERE (do_loop_closing: false):
    #   The Phase-1 sim world is a near-symmetric 10x10m room (walls on all
    #   four sides, mirrored shelf rows on x=+1.5 and x=-1.5, one box at
    #   (0, -1)). From many positions the 360° scan looks strikingly similar
    #   to scans taken 4-6m away — the box and shelf rows look near-identical
    #   from positions equidistant from them.
    #
    #   Symptom (before this fix): driving close along the walls near the
    #   box (e.g. along the south wall on the outside of the box) triggers
    #   slam_toolbox's loop-closure search to match the current scan against
    #   a near-twin scan from a different part of the room. Even with tight
    #   response thresholds (loop_match_minimum_response_fine: 0.65, loop_
    #   search_maximum_distance: 4.0) the symmetric room produces matches
    #   that pass both coarse and fine gates. slam_toolbox then re-anchors
    #   the pose graph, RViz's Map display (anchored to odom) slides under
    #   the robot, and subsequent scans get placed from the wrong anchor —
    #   corrupting the map.
    #
    #   With loop closing disabled, the per-step scan-to-scan link matching
    #   is still active but no global pose-graph corrections happen. The
    #   10x10m room is small enough that gz DiffDrive's 30Hz wheel-encoder
    #   odometry (published at /odom with frame odom -> base_link) doesn't
    #   accumulate enough drift to matter for Phase 1 — *provided* the robot
    #   isn't being driven into walls. The gz DiffDrive plugin is a velocity
    #   controller: it integrates wheel encoder counts into /odom regardless
    #   of contact, so ramming a wall while holding positive cmd_vel makes
    #   /odom advance while the robot stays in place. Real robots with
    #   current-sensing motor drivers don't have this issue (stall-current
    #   trips the cutoff). Avoid wall-ramming in Phase-1 sim tests; if you
    #   see /odom vs reality diverging, that's the cause.
    #
    #   Phase-2 plan: add at least one asymmetric feature to the world
    #   (e.g. a 0.3x0.3x1.5m pillar at (3.5, 3.5)) so scans at different
    #   positions look distinguishably different. With the pillar in place,
    #   loop closing can be re-enabled with the upstream-style defaults.
    do_loop_closing: false
    #
    # Per-step link matching — tight so bogus per-step alignments are
    # rejected. Threshold 0.85 = "match must be very strong" (default is
    # 0.1, which is far too permissive for a symmetric room).
    link_match_minimum_response_fine: 0.85
    link_scan_max_distance: 0.8
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    #
    # Loop-closure params below are kept at upstream-safe values so that
    # re-enabling do_loop_closing only requires flipping the flag above.
    # They are NOT consulted by slam_toolbox while do_loop_closing is false.
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_match_maximum_variance_coarse: 3.0

    # Solver — on lyrical slam_toolbox only ships `CeresSolver`, not SpaSolver.
    optimization_solver: slam_toolbox_msgs/msg/SolverMsg
    solver_plugin: solver_plugins::CeresSolver

    use_scan_matching: true
    use_scan_barycenter: true

    # Timing
    transform_publish_period: 0.05   # 20 Hz TF
    tf_buffer_duration: 30.0
    throttle_scans: 1
    publish_occupancy_grid: true
    publish_tf: true

    debug_logging: false
