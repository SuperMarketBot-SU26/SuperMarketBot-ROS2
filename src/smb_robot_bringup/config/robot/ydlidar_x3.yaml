# YDLIDAR X3 parameters for SuperMarketBot (direct Pi 5 USB connection).
#
# The X3 is a triangulation LiDAR (lidar_type: 1) with:
#   - 360° scan, single channel
#   - 115200 baud serial (confirmed by user)
#   - Range: 0.12 – 8.0 m
#   - Scan rate: ~6-10 Hz
#
# These params are loaded by smb_robot.launch.py when launching the
# ydlidar_ros2_driver_node directly on the Pi 5.

ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB0
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    sample_rate: 3
    abnormal_check_count: 4
    fixed_resolution: true
    # X3 uses the same 115200/single-channel scan convention as the vendor X2
    # profile. Mounting yaw belongs in URDF; do not mirror/rotate samples here.
    reversion: false
    inverted: false
    auto_reconnect: true
    isSingleChannel: true
    intensity_bit: 0
    intensity: false
    support_motor_dtr: true
    angle_max: 180.0
    angle_min: -180.0
    range_max: 8.0
    range_min: 0.12
    frequency: 8.0
    invalid_range_is_inf: false
    debug: false
