# SLAM Toolbox config for SuperMarketBot REAL-ROBOT mode.
#
# This is the mirror of config/sim/slam_toolbox.yaml with loop closing
# re-enabled. The real-robot world is not the symmetric 10x10m sim room,
# so the loop-closure false-positive that triggered the snap in sim is
# not expected here.
#
# v2.3 tuning (Jul 28 2026): loosened minimum_travel_*, link_scan_max_distance,
# correlation_search_space_dimension and tightened loop_search_maximum_distance
# to compensate for ESP32 /scan running at 1-2 Hz instead of 10 Hz (the firmware
# is CPU-bound on WiFi + LiDAR UART + micro-ROS UDP). Without these changes,
# scan-to-submap matching fails when the robot moves between scans, the
# submap graph splits, and you see "the old map stays, a new one pops on top"
# in RViz. See inline comments for the per-parameter rationale.
#
# When you move to a new environment:
#   - `loop_search_maximum_distance` (1.5 m) is the search horizon for
#     loop-closure candidates. In a larger office/aisle, raise to 3-5 m so
#     genuine revisits across rooms are found.
#   - `loop_match_minimum_response_fine` (0.45) — tighten if you see
#     false loops. Loosen if genuine loops aren't closing.
#
# Phase-2 plan: replace this file with the IOT-repo port
# (ros2_bridge/config/mapper_params_online_async.yaml) once available.
# That one was tuned on real hardware and is the canonical version.

slam_toolbox:
  ros__parameters:
    # Frames (must match docs/TOPIC_CONTRACT.md)
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    # /scan messages arrive with header.frame_id = `laser_frame` because
    # the ESP32's MicroRos.h publishes with frame_id = "laser_frame" and
    # the URDF links laser_frame to base_link via robot_state_publisher.
    # ESP32 publishes /scan with RELIABLE QoS; slam_toolbox subscribes with
    # BEST_EFFORT — incompatible under DDS, so discovery rejects the match
    # and no scan ever reaches SLAM. The scan_relay node (smb_nodes) bridges
    # both QoS and timestamp: subscribes RELIABLE on /scan, republishes
    # BEST_EFFORT on /scan_relay with header.stamp replaced by the relay's
    # current ROS2 clock (ESP32 fills stamp with millis()/1000, not Unix
    # epoch, so without rewriting slam_toolbox drops every scan as
    # "earlier than all the data in the transform cache"). slam_toolbox
    # reads from /scan_relay.
    scan_topic: /scan_relay

    # Map params
    mode: mapping          # online_async
    resolution: 0.05       # 5cm pixel, suitable for indoor supermarket
    map_start_x: 0.0
    map_start_y: 0.0
    map_start_yaw: 0.0
    map_file_name: "/home/nhatkhoa1124/ros2_ws/src/smb_robot_bringup/maps/room_map"
    map_start_at_dock: true

    # Match the YDLIDAR X3 spec + bridge-side filter range
    max_laser_range: 6.0
    min_laser_range: 0.15

    # Pose graph — slightly looser than sim to allow genuine returns in
    # a real environment (not a 10x10m box). Real robot has wheel-encoder
    # odometry that drifts a bit, so we want enough candidates.
    #
    minimum_travel_distance: 0.02   # 2cm threshold: maintain responsive map updating without excessive CPU load
    minimum_travel_heading: 0.005   # ~0.28 deg turn threshold: trigger rapid rotational updates every quarter-degree of turning so SLAM orientation aligns instantaneously with LiDAR scans
    minimum_time_interval: 0.04     # 25 Hz maximum update rate: leverage host laptop computing power to optimize submaps instantaneously as unthrottled scans arrive
    skip_odometry: false

    # Scan matching
    do_loop_closing: true
    link_match_minimum_response_fine: 0.1
    link_scan_max_distance: 5.0
    correlation_search_space_dimension: 1.0   # ±1.0m search window: expand scan matching search perimeter to locate wall geometry when odometry drifts beyond 50cm during turning maneuvers
    correlation_search_space_resolution: 0.05 # 5cm resolution MUST match occupancy grid resolution (0.05) to prevent 'unable to get pointer in probability search' runtime crashes
    correlation_search_space_smear_deviation: 0.05 # 5cm blur window matching grid resolution

    # Loop-closure params
    loop_search_maximum_distance: 1.5
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.3
    loop_match_maximum_variance_coarse: 3.0

    # Solver
    optimization_solver: slam_toolbox_msgs/msg/SolverMsg
    solver_plugin: solver_plugins::CeresSolver
    threads: 8                         # Allocate 8 processing threads to parallelize Ceres graph optimization and scan matcher loops
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss
    distance_variance_penalty: 0.4      # Tuned to 0.4: firm balance between stabilized odometry translation and dense scan convergence
    angle_variance_penalty: 0.0001      # Reduced to 0.0001 (100x reduction): virtually eliminate odometry rotational resistance so Ceres scan matcher aggressively rotates and locks LiDAR scans onto room geometry
    use_scan_matching: true
    use_scan_barycenter: true

    # Timing
    transform_publish_period: 0.02   # 50 Hz TF: continuous high-speed coordinate synchronization for ultra-smooth RViz displays
    tf_buffer_duration: 60.0
    # scan_queue_size: expanded to 40 to absorb UDP packet transmissions for high-density 720-beam scans without dropping frames.
    scan_queue_size: 40
    # transform_tolerance: how far in the past a TF lookup can be.
    transform_tolerance: 1.0   # 1.0s tolerance: accommodate 4G mobile network transmission jitter without inducing TF extrapolation errors during driving
    throttle_scans: 1
    publish_occupancy_grid: true
    publish_tf: true
    debug_logging: false
