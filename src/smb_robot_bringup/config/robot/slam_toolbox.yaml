# SLAM Toolbox config for SuperMarketBot REAL-ROBOT mode.
#
# This is the mirror of config/sim/slam_toolbox.yaml with loop closing
# re-enabled. The real-robot world is not the symmetric 10x10m sim room,
# so the loop-closure false-positive that triggered the snap in sim is
# not expected here.
#
# USB Serial architecture (Aug 2026): Removed aggressive detuning since
# hardware is now natively connected via USB without WiFi jitter or UDP drops.
#
# When you move to a new environment:
#   - `loop_search_maximum_distance` (1.5 m) is the search horizon for
#     loop-closure candidates. In a larger office/aisle, raise to 3-5 m so
#     genuine revisits across rooms are found.
#   - `loop_match_minimum_response_fine` (0.45) — tighten if you see
#     false loops. Loosen if genuine loops aren't closing.
#
# Phase-2 plan: replace this file with the IOT-repo port
# (ros2_bridge/config/mapper_params_online_async.yaml) once available.
# That one was tuned on real hardware and is the canonical version.

slam_toolbox:
  ros__parameters:
    # Frames (must match docs/TOPIC_CONTRACT.md)
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    # /scan messages arrive with header.frame_id = `laser_frame` because
    # the URDF links laser_frame to base_link via robot_state_publisher.
    # YDLIDAR X3 is connected directly to Pi 5 via USB (not through ESP32).
    # The driver publishes /scan with BEST_EFFORT QoS and wall-clock timestamps,
    # so no relay is needed.
    scan_topic: /scan

    # Map params
    mode: mapping          # online_async
    resolution: 0.05       # 5cm pixel, suitable for indoor supermarket
    map_start_x: 0.0
    map_start_y: 0.0
    map_start_yaw: 0.0
    map_file_name: "/ros2_ws/src/smb_robot_bringup/maps/room_map"
    map_start_at_dock: true

    # Match the YDLIDAR X3 spec + bridge-side filter range
    max_laser_range: 6.0
    min_laser_range: 0.15

    # Pose graph — slightly looser than sim to allow genuine returns in
    # a real environment (not a 10x10m box). Real robot has wheel-encoder
    # odometry that drifts a bit, so we want enough candidates.
    #
    minimum_travel_distance: 0.02   # 2cm threshold: aggressively correct pose during linear movement
    minimum_travel_heading: 0.01    # ~0.5 deg turn threshold: trigger rapid rotational updates
    minimum_time_interval: 0.1      # 10 Hz maximum update rate when stationary
    skip_odometry: false

    # Scan matching
    do_loop_closing: true
    link_match_minimum_response_fine: 0.4
    link_scan_max_distance: 5.0
    correlation_search_space_dimension: 0.3   # ±0.3m search window: adequate for stable 50Hz serial odometry
    correlation_search_space_resolution: 0.05 # 5cm resolution MUST match occupancy grid resolution (0.05) to prevent 'unable to get pointer in probability search' runtime crashes
    correlation_search_space_smear_deviation: 0.05 # 5cm blur window matching grid resolution

    # Loop-closure params
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55
    loop_match_maximum_variance_coarse: 3.0

    # Solver
    optimization_solver: slam_toolbox_msgs/msg/SolverMsg
    solver_plugin: solver_plugins::CeresSolver
    threads: 8                         # Allocate 8 processing threads to parallelize Ceres graph optimization and scan matcher loops
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss
    distance_variance_penalty: 0.4      # Tuned to 0.4: firm balance between stabilized odometry translation and dense scan convergence
    angle_variance_penalty: 0.0001      # Reduced to 0.0001 (100x reduction): virtually eliminate odometry rotational resistance so Ceres scan matcher aggressively rotates and locks LiDAR scans onto room geometry
    use_scan_matching: true
    use_scan_barycenter: true

    # Timing
    transform_publish_period: 0.02   # 50 Hz TF: continuous high-speed coordinate synchronization for ultra-smooth RViz displays
    tf_buffer_duration: 60.0
    scan_queue_size: 10        # Local USB serial, no UDP drops
    # transform_tolerance: how far in the past a TF lookup can be.
    transform_tolerance: 1.0   # 0.2s tolerance is plenty for local USB serial
    throttle_scans: 1
    publish_occupancy_grid: true
    publish_tf: true
    debug_logging: false
