# SLAM Toolbox config for SuperMarketBot REAL-ROBOT mode.
#
# This is the mirror of config/sim/slam_toolbox.yaml with loop closing
# re-enabled. The real-robot world is not the symmetric 10x10m sim room,
# so the loop-closure false-positive that triggered the snap in sim is
# not expected here.
#
# v2.3 tuning (Jul 28 2026): loosened minimum_travel_*, link_scan_max_distance,
# correlation_search_space_dimension and tightened loop_search_maximum_distance
# to compensate for ESP32 /scan running at 1-2 Hz instead of 10 Hz (the firmware
# is CPU-bound on WiFi + LiDAR UART + micro-ROS UDP). Without these changes,
# scan-to-submap matching fails when the robot moves between scans, the
# submap graph splits, and you see "the old map stays, a new one pops on top"
# in RViz. See inline comments for the per-parameter rationale.
#
# When you move to a new environment:
#   - `loop_search_maximum_distance` (1.5 m) is the search horizon for
#     loop-closure candidates. In a larger office/aisle, raise to 3-5 m so
#     genuine revisits across rooms are found.
#   - `loop_match_minimum_response_fine` (0.45) — tighten if you see
#     false loops. Loosen if genuine loops aren't closing.
#
# Phase-2 plan: replace this file with the IOT-repo port
# (ros2_bridge/config/mapper_params_online_async.yaml) once available.
# That one was tuned on real hardware and is the canonical version.

slam_toolbox:
  ros__parameters:
    # Frames (must match docs/TOPIC_CONTRACT.md)
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    # /scan messages arrive with header.frame_id = `laser_frame` because
    # the ESP32's MicroRos.h publishes with frame_id = "laser_frame" and
    # the URDF links laser_frame to base_link via robot_state_publisher.
    # ESP32 publishes /scan with RELIABLE QoS; slam_toolbox subscribes with
    # BEST_EFFORT — incompatible under DDS, so discovery rejects the match
    # and no scan ever reaches SLAM. The scan_relay node (smb_nodes) bridges
    # both QoS and timestamp: subscribes RELIABLE on /scan, republishes
    # BEST_EFFORT on /scan_relay with header.stamp replaced by the relay's
    # current ROS2 clock (ESP32 fills stamp with millis()/1000, not Unix
    # epoch, so without rewriting slam_toolbox drops every scan as
    # "earlier than all the data in the transform cache"). slam_toolbox
    # reads from /scan_relay.
    scan_topic: /scan_relay

    # Map params
    mode: mapping          # online_async
    resolution: 0.05       # 5cm pixel, suitable for indoor supermarket
    map_start_x: 0.0
    map_start_y: 0.0
    map_start_yaw: 0.0

    # Match the YDLIDAR X3 spec + bridge-side filter range
    max_laser_range: 6.0
    min_laser_range: 0.15

    # Pose graph — slightly looser than sim to allow genuine returns in
    # a real environment (not a 10x10m box). Real robot has wheel-encoder
    # odometry that drifts a bit, so we want enough candidates.
    #
    # v2.3: minimum_travel* and link_scan_max_distance LOOSENED because the
    # ESP32 publishes /scan at ~1-2 Hz (instead of 10 Hz) when WiFi + micro-ROS
    # UDP backpressure + LiDAR UART parsing all compete for CPU. With sparse
    # scans the robot can move 10-30cm between consecutive scans, which is
    # larger than the original 0.5m / 1.5m thresholds assumed for a 10 Hz
    # stream. Without these looser values, slam_toolbox rejects most new scans
    # as "moved too far" → new submap spawns at the wrong location → user
    # sees "map stays there, new map pops on top" instead of one connected map.
    minimum_travel_distance: 0.05  # was 0.2 — register scans very frequently (every 5cm) for max snappiness
    minimum_travel_heading: 0.05   # was 0.2 — register scans after very small rotations (every ~2.8 degrees)
    skip_odometry: false

    # Scan matching.
    #
    # WHY LOOP CLOSING IS ENABLED HERE (do_loop_closing: true):
    #   The real-robot environment is not the symmetric 10x10m sim room,
    #   so loop-closure false positives aren't a concern. The ESP32 wheel
    #   encoders accumulate drift over time (~5-10 cm per minute of motion
    #   on smooth surfaces), and without loop closure the map will
    #   gradually warp as odom drift compounds.
    #
    #   Thresholds are kept at moderate values — tighten
    #   `loop_match_minimum_response_fine` (default 0.45) if you see
    #   false loops snap the pose graph, loosen if genuine loops aren't
    #   closing.
    do_loop_closing: true
    #
    # Per-step link matching — keep tighter than upstream defaults (0.1)
    # but allow some flexibility for real-world sensor noise + sparse scans.
    # v2.3: link_scan_max_distance + correlation_search_space_dimension INCREASED
    # for the same reason as minimum_travel_* above: ESP32 ~1-2 Hz scan rate +
    # wheel-encoder drift means consecutive scans can be 30-50cm apart and
    # the odometry can be off by 30cm+. Need a wider search window so the
    # scan-to-submap correlator can lock on. Otherwise it fails the match,
    # starts a new submap, and the map "pops" instead of stitching.
    link_match_minimum_response_fine: 0.55
    link_scan_max_distance: 5.0   # was 1.5 — match scans up to 5m apart (drift)
    correlation_search_space_dimension: 1.5  # was 0.5 — search ±1.5m window
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    #
    # Loop-closure params — upstream defaults; tuned for real environment.
    # v2.3: loop_search_maximum_distance REDUCED so loop closure considers
    # nearby submaps (within 1.5m) even when wheel-encoder drift has moved
    # them apart by tens of cm. Combined with the wider link_scan_max_distance,
    # this is what stitches consecutive submaps when the robot returns to
    # a previously-mapped area after exploring.
    loop_search_maximum_distance: 1.5   # was 3.0
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_match_maximum_variance_coarse: 3.0

    # Solver — on lyrical slam_toolbox only ships `CeresSolver`, not SpaSolver.
    optimization_solver: slam_toolbox_msgs/msg/SolverMsg
    solver_plugin: solver_plugins::CeresSolver

    use_scan_matching: true
    use_scan_barycenter: true

    # Timing
    transform_publish_period: 0.1   # 10 Hz TF (was 20 Hz; odom TF is ~10-15 Hz, publishing faster just repeats stale data)
    tf_buffer_duration: 60.0   # 60s: tolerate late ESP32 handshake (was 30s,
                               # but with autostart=false this is mostly belt-and-suspenders)
    # v2.4 (Jul 29 2026): Added for ESP32 1-2 Hz scan rate.
    # scan_queue_size: increase buffer so late-arriving scans at 2 Hz don't get
    # dropped. slam_toolbox processes one scan per call; with a 2 Hz input the
    # default queue of 5 means ~2.5s buffer — enough for typical timing jitter.
    scan_queue_size: 20
    # transform_tolerance: how far in the past a TF lookup can be.
    # At 1 Hz scans the scan-to-pose transform might lag. 0.5s gives margin.
    transform_tolerance: 1.0   # was 0.5; at ~3-10 Hz map→odom TF, need 1.0s headroom
    throttle_scans: 1
    publish_occupancy_grid: true
    publish_tf: true

    debug_logging: false